name: Strbuf CI

on:
  pull_request:
    branches: ['*']

jobs:
  check-pr-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR target branch
        if: ${{ github.event.pull_request.base.ref == 'main' }}
        run: |
          echo "PRs to main branch are not allowed!"
          curl -s -S -H "Authorization: token ${{ secrets.BOT_TOKEN }}" \
               -H "Content-Type: application/json" \
               -X POST \
               -d "{\"body\":\" 请勿向 main 分支提交 pr ! \"}" \
               "${{ github.event.pull_request.comments_url }}"
          exit 1

  run-tests:
    runs-on: ubuntu-latest
    needs: check-pr-branch
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run test script
        run: |
          chmod +x ./.github/test.sh
          timeout 300 ./.github/test.sh || code=$?; if [[ $code -ne 0 ]]; then exit $code; fi
        shell: bash
        env:
          PR_ID: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}

